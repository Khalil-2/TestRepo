<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><title>Greeting</title><style>button:hover:not(:disabled){filter:brightness(90%)}:focus-visible{outline:3px solid #0056b3;outline-offset:2px}#clearBtn{background:transparent;color:#666;border:none;padding:0;width:32px;height:32px;border-radius:50%;display:none;position:absolute;right:4px;top:50%;transform:translateY(-50%);align-items:center;justify-content:center;line-height:1;cursor:pointer}#clearBtn:hover{background:#eee;color:#333}@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}.fade-in{animation:fadeIn 0.3s ease-out}</style></head>
<body style="font-family:system-ui;max-width:400px;margin:2rem auto;padding:0 1rem"><h1>Greeting Generator</h1>
  <form id="greetingForm"><div style="display:flex;justify-content:space-between"><label for="nameInput">Your Name</label><span id="charCounter" style="font-size:.875rem;color:#666">0/20</span></div>
    <div style="margin:.5rem 0;position:relative"><input id="nameInput" maxlength="20" aria-describedby="charCounter" required style="width:100%;box-sizing:border-box;padding-right:2.5rem"><button type="button" id="clearBtn" aria-label="Clear name input">×</button></div><button type="submit" id="submitBtn">Generate Greeting</button></form>
  <div style="margin-top:1.5rem;display:flex;align-items:center;gap:.5rem"><div id="status" aria-live="polite" style="font-weight:bold"></div><button id="copyBtn" aria-label="Copy greeting" style="display:none">Copy</button></div><div id="copyAnnouncer" aria-live="polite" style="position:fixed;top:-100%"></div>
  <script>
    const form = document.getElementById('greetingForm'), input = document.getElementById('nameInput'), counter = document.getElementById('charCounter'), submitBtn = document.getElementById('submitBtn'), status = document.getElementById('status'), copyBtn = document.getElementById('copyBtn'), announcer = document.getElementById('copyAnnouncer'), clearBtn = document.getElementById('clearBtn');
    let greeting = '', copyTimeout;
    const updateCounter = () => {
      const len = input.value.length; counter.textContent = `${len}/20`;
      counter.style.color = len >= 18 ? '#dc3545' : (len >= 15 ? '#fd7e14' : '#666');
      counter.style.fontWeight = len >= 15 ? 'bold' : 'normal';
      clearBtn.style.display = (len > 0 && !input.disabled) ? 'flex' : 'none';
    };
    input.addEventListener('input', updateCounter);
    clearBtn.addEventListener('click', () => { input.value = ''; updateCounter(); input.focus(); });
    form.addEventListener('submit', (e) => {
      e.preventDefault(); const name = input.value.trim();
      submitBtn.disabled = input.disabled = true; submitBtn.textContent = 'Generating...';
      status.textContent = ''; status.classList.remove('fade-in'); copyBtn.style.display = 'none'; updateCounter();
      setTimeout(() => {
        greeting = `Hello, ${name}! 🎨`; status.textContent = greeting; status.classList.add('fade-in');
        submitBtn.disabled = input.disabled = false; submitBtn.textContent = 'Generate Greeting';
        form.reset(); updateCounter();
        copyBtn.style.display = 'inline-block'; submitBtn.focus();
      }, 800);
    });
    copyBtn.addEventListener('click', () => {
      if (copyTimeout) return;
      navigator.clipboard.writeText(greeting).then(() => {
        copyBtn.textContent = 'Copied! ✅'; copyBtn.setAttribute('aria-label', 'Greeting copied'); announcer.textContent = '';
        setTimeout(() => { announcer.textContent = 'Greeting copied to clipboard'; }, 50);
        copyTimeout = setTimeout(() => {
          copyBtn.textContent = 'Copy'; copyBtn.setAttribute('aria-label', 'Copy greeting'); copyTimeout = null;
        }, 2000);
      });
    });
  </script></body></html>
