<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TestRepo</title><style>
:root{font-family:system-ui;line-height:1.5}
.skip-link{position:fixed;top:-100%;left:0;z-index:100}.skip-link:focus{top:0;background:#0056b3;color:#fff;padding:.5rem}
#liveRegion{margin-top:1rem;font-weight:700;color:#155724}
button:focus-visible{outline:3px solid #0056b3;outline-offset:2px}
</style></head>
<body style="max-width:800px;margin:2rem auto;padding:0 1rem">
<a href="#main" class="skip-link">Skip to main content</a>
<header><h1>Welcome to TestRepo</h1></header>
<main id="main" tabindex="-1">
<p>Minimal accessible landing page with interactive delight.</p>
<label for="name-input" style="display:block;margin-bottom:.5rem">Your Name</label>
<input id="name-input" type="text" maxlength="20" aria-describedby="char-count" style="padding:.5rem;margin-bottom:.5rem">
<div id="char-count" style="font-size:.875rem;color:#666;margin-bottom:1rem">0 / 20 characters</div>
<button id="msg-btn" type="button" style="padding:.5rem 1rem;cursor:pointer">Generate Greeting</button>
<div id="liveRegion" aria-live="polite"></div>
</main>
<script>
const input = document.getElementById('name-input'), count = document.getElementById('char-count'), btn = document.getElementById('msg-btn'), live = document.getElementById('liveRegion');
input.oninput = () => count.textContent = `${input.value.length} / 20 characters`;
btn.onclick = () => {
const name = input.value.trim();
live.textContent = '';
live.textContent = name ? `Hello, ${name}! 🎨 Welcome to TestRepo.` : 'Hello! 🎨 Welcome to TestRepo.';
btn.focus();
};
</script>
</body></html>
