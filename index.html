<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Palette UX</title><style>
:root{font-family:system-ui;line-height:1.5}
.skip-link{position:fixed;top:-100%;left:0;z-index:100}.skip-link:focus{top:0;background:#0056b3;color:#fff;padding:.5rem}
#liveRegion{margin-top:1rem;font-weight:700;color:#155724} button:disabled{opacity:.7;cursor:not-allowed}
</style></head>
<body style="max-width:800px;margin:2rem auto;padding:0 1rem">
<a href="#main" class="skip-link">Skip to main content</a>
<header><h1>Palette UX</h1></header>
<main id="main" tabindex="-1">
<form id="greetForm">
<label for="name">Name:</label>
<input id="name" maxlength="20" aria-describedby="counter" required>
<small id="counter">0/20</small>
<button id="greetBtn" type="submit" style="margin-left:.5rem">Greet</button>
</form>
<div id="liveRegion" aria-live="polite"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const form = $('greetForm'), nameInput = $('name'), counter = $('counter'), greetBtn = $('greetBtn'), liveRegion = $('liveRegion');
nameInput.oninput = () => counter.textContent = `${nameInput.value.length}/20`;
form.onsubmit = (event) => {
  event.preventDefault();
  greetBtn.disabled = true;
  greetBtn.textContent = 'Loading...';
  liveRegion.textContent = '';
  setTimeout(() => {
    liveRegion.textContent = `Hello, ${nameInput.value}! 🎨`;
    greetBtn.disabled = false;
    greetBtn.textContent = 'Greet';
    greetBtn.focus();
  }, 800);
};
</script>
</body></html>
