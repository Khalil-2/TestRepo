<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Greeting</title>
<style>:root{font-family:system-ui;line-height:1.5}body{max-width:500px;margin:2rem auto;padding:0 1rem}.skip{position:fixed;top:-100%}.skip:focus{top:0;background:#0056b3;color:#fff;padding:.5rem}#statusContainer{display:flex;align-items:center;margin-top:1.5rem;gap:.5rem}#status{font-weight:700;color:#155724}button,input{padding:.5rem;border:1px solid #ccc;border-radius:4px;font:inherit}button{background:#007bff;color:#fff;border:none;cursor:pointer;transition:filter .2s}button:hover:not(:disabled){filter:brightness(90%)}button:disabled{opacity:.6}:focus-visible{outline:3px solid #0056b3;outline-offset:2px}</style></head>
<body><a href="#main" class="skip">Skip to main content</a><main id="main" tabindex="-1"><h1>Greeting Generator</h1>
<form id="greetingForm"><label for="nameInput">Your Name</label> <input id="nameInput" maxlength="20" autocomplete="name" aria-describedby="charCounter" required> <span id="charCounter" style="font-size:.875rem;color:#666">0/20</span><div style="margin-top:1rem"><button type="submit" id="submitBtn">Generate Greeting</button></div></form>
<div id="statusContainer"><div id="status" aria-live="polite"></div><button id="copyBtn" aria-label="Copy greeting" style="display:none;padding:.25rem .5rem;font-size:.875rem">Copy</button></div><div id="copyAnnouncer" aria-live="polite" class="skip"></div></main>
<script>
const greetingForm = document.getElementById('greetingForm'), nameInput = document.getElementById('nameInput'), charCounter = document.getElementById('charCounter'), submitBtn = document.getElementById('submitBtn'), statusDisplay = document.getElementById('status'), copyBtn = document.getElementById('copyBtn'), copyAnnouncer = document.getElementById('copyAnnouncer');
let greetingText = '', copyTimeout;
nameInput.addEventListener('input', () => { charCounter.textContent = `${nameInput.value.length}/20`; });
greetingForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const name = nameInput.value.trim(); if (!name) return;
  submitBtn.disabled = nameInput.disabled = true;
  const originalText = submitBtn.textContent; submitBtn.textContent = 'Generating...';
  statusDisplay.textContent = ''; copyBtn.style.display = 'none';
  setTimeout(() => {
    greetingText = `Hello, ${name}! 🎨`; statusDisplay.textContent = greetingText;
    submitBtn.disabled = nameInput.disabled = false; submitBtn.textContent = originalText;
    greetingForm.reset(); charCounter.textContent = '0/20';
    copyBtn.style.display = 'inline-block'; submitBtn.focus();
  }, 800);
});
copyBtn.addEventListener('click', () => {
  if (copyTimeout) return;
  navigator.clipboard.writeText(greetingText).then(() => {
    copyBtn.textContent = 'Copied! ✅'; copyBtn.setAttribute('aria-label', 'Greeting copied');
    copyAnnouncer.textContent = '';
    setTimeout(() => { copyAnnouncer.textContent = 'Greeting copied to clipboard'; }, 50);
    copyTimeout = setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.setAttribute('aria-label', 'Copy greeting'); copyTimeout = null; }, 2000);
  });
});
</script></body></html>
