<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Greeting</title>
<style>:root{font-family:system-ui;line-height:1.5}body{max-width:500px;margin:2rem auto;padding:0 1rem}.skip-link{position:fixed;top:-100%}.skip-link:focus{top:0;background:#0056b3;color:#fff;padding:.5rem}#status{margin-top:1.5rem;font-weight:700;color:#155724}button,input{padding:.5rem;border:1px solid #ccc;border-radius:4px;font:inherit}button{background:#007bff;color:#fff;border:none;cursor:pointer;transition:filter .2s}button:hover:not(:disabled){filter:brightness(90%)}button:disabled{opacity:.6}:focus-visible{outline:3px solid #0056b3;outline-offset:2px}</style></head>
<body><a href="#main" class="skip-link">Skip to main content</a><main id="main" tabindex="-1"><h1>Greeting Generator</h1>
<form id="greetingForm"><label for="nameInput">Your Name</label> <input id="nameInput" maxlength="20" autocomplete="name" aria-describedby="charCounter" required> <span id="charCounter" style="font-size:.875rem;color:#666">0/20</span><div style="margin-top:1rem"><button type="submit" id="submitBtn">Generate Greeting</button></div></form><div id="status" aria-live="polite"></div></main>
<script>const f=document.getElementById('greetingForm'),i=document.getElementById('nameInput'),c=document.getElementById('charCounter'),b=document.getElementById('submitBtn'),s=document.getElementById('status');
i.oninput=()=>c.textContent=`${i.value.length}/20`;f.onsubmit=(e)=>{e.preventDefault();const n=i.value.trim();if(!n)return;b.disabled=i.disabled=true;const t=b.textContent;b.textContent='Generating...';s.textContent='';setTimeout(()=>{s.textContent=`Hello, ${n}! 🎨`;b.disabled=i.disabled=false;b.textContent=t;f.reset();c.textContent='0/20';b.focus();},800)};</script></body></html>
