<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Greeting Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 2rem auto; padding: 0 1rem; }
    .field { position: relative; margin: 0.5rem 0; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    #clearBtn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: none; background: none; border: none; cursor: pointer; font-size: 1.1rem; color: #666; }
    #status { font-weight: bold; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Greeting Generator</h1>
  <form id="greetingForm">
    <div class="row">
      <label for="nameInput">Your Name</label>
      <span id="charCounter" style="font-size:0.875rem; color:#666;">0/20</span>
    </div>
    <div class="field">
      <input id="nameInput" maxlength="20" aria-describedby="charCounter" aria-keyshortcuts="Escape" required style="width:100%; box-sizing:border-box; padding: 0.4rem 2rem 0.4rem 0.5rem;">
      <button type="button" id="clearBtn" aria-label="Clear name input" title="Clear name (Esc)">×</button>
    </div>
    <button type="submit">Generate Greeting</button>
  </form>
  <div id="status" aria-live="polite"></div>
  <script>
    const form = document.getElementById('greetingForm'), input = document.getElementById('nameInput'), clearBtn = document.getElementById('clearBtn'), announcer = document.getElementById('status'), counter = document.getElementById('charCounter');
    const clearInput = () => { input.value = ''; clearBtn.style.display = 'none'; counter.textContent = '0/20'; announcer.textContent = 'Input cleared'; input.focus(); };
    input.addEventListener('input', () => { clearBtn.style.display = input.value ? 'inline-block' : 'none'; counter.textContent = `${input.value.length}/20`; });
    clearBtn.addEventListener('click', clearInput);
    input.addEventListener('keydown', (e) => { if (e.key === 'Escape' && input.value) clearInput(); });
    form.addEventListener('submit', (e) => { e.preventDefault(); announcer.textContent = `Hello, ${input.value.trim()}! 🎨`; });
  </script>
</body>
</html>
