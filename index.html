<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greeting Generator</title>
  <style>
    button, input { transition: all 0.2s; }
    button:hover:not(:disabled) { filter: brightness(90%); cursor: pointer; }
    button:disabled { background: #ccc; color: #666; cursor: not-allowed; }
    :focus-visible { outline: 3px solid #0056b3; outline-offset: 2px; }
  </style>
</head>
<body style="font-family: system-ui; max-width: 400px; margin: 2rem auto; padding: 0 1rem;">
  <h1>Greeting Generator</h1>
  <form id="greetingForm">
    <label for="nameInput">Your Name</label>
    <div style="margin: 0.5rem 0;">
      <input id="nameInput" aria-keyshortcuts="Escape" required style="width: 100%; box-sizing: border-box;">
    </div>
    <button type="submit" id="submitBtn">Generate Greeting</button>
  </form>
  <div id="status" aria-live="polite" style="margin-top: 1.5rem; font-weight: bold;"></div>
  <script>
    const form = document.getElementById('greetingForm');
    const input = document.getElementById('nameInput');
    const status = document.getElementById('status');
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && input.value) {
        input.value = '';
      }
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      status.textContent = `Hello, ${input.value.trim()}! 🎨`;
      form.reset();
    });
  </script>
</body>
</html>
