<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greeting</title>
  <style>
    button, input { transition: all 0.2s; }
    button:hover:not(:disabled) { filter: brightness(90%); cursor: pointer; }
    button:disabled { background: #ccc; color: #666; cursor: not-allowed; }
    :focus-visible { outline: 3px solid #0056b3; outline-offset: 2px; }
    #clearBtn {
      background: transparent; color: #666; border: none; padding: 0; width: 32px; height: 32px;
      border-radius: 50%; display: none; position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      align-items: center; justify-content: center; line-height: 1; cursor: pointer;
    }
    #clearBtn:hover { background: #eee; color: #333; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease-out; }
  </style>
</head>
<body style="font-family: system-ui; max-width: 400px; margin: 2rem auto; padding: 0 1rem;">
  <h1>Greeting Generator</h1>
  <form id="greetingForm">
    <div style="display: flex; justify-content: space-between;">
      <label for="nameInput">Your Name</label>
      <span id="charCounter" style="font-size: 0.875rem; color: #666;">0/20</span>
    </div>
    <div style="margin: 0.5rem 0; position: relative;">
      <input id="nameInput" maxlength="20" aria-describedby="charCounter" aria-keyshortcuts="Escape" required style="width: 100%; box-sizing: border-box; padding-right: 2.5rem;">
      <button type="button" id="clearBtn" aria-label="Clear name input" title="Clear name (Esc)">×</button>
    </div>
    <div id="progressBar" role="progressbar" aria-label="Character limit progress" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" style="height: 4px; width: 0%; opacity: 0; background: #0056b3; border-radius: 2px; margin: 0.6rem 0 0.5rem; transition: width 0.1s, background 0.1s, opacity 0.1s;"></div>
    <button type="submit" id="submitBtn">Generate Greeting</button>
  </form>
  <div style="margin-top: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
    <div id="status" aria-live="polite" style="font-weight: bold;"></div>
    <button id="copyBtn" aria-label="Copy greeting" style="display: none;">Copy</button>
  </div>
  <div id="copyAnnouncer" aria-live="polite" style="position: fixed; top: -100%;"></div>
  <script>
    const greetingForm = document.getElementById('greetingForm');
    const nameInput = document.getElementById('nameInput');
    const charCounter = document.getElementById('charCounter');
    const submitButton = document.getElementById('submitBtn');
    const statusDisplay = document.getElementById('status');
    const copyButton = document.getElementById('copyBtn');
    const copyAnnouncer = document.getElementById('copyAnnouncer');
    const clearButton = document.getElementById('clearBtn');
    const progressBar = document.getElementById('progressBar');
    let greeting = '';
    let copyTimeout;
    let lastAlert = 0;

    const updateCounter = () => {
      const len = nameInput.value.length;
      charCounter.textContent = `${len}/20`;
      charCounter.style.color = len >= 18 ? '#dc3545' : (len >= 15 ? '#fd7e14' : '#666');
      charCounter.style.fontWeight = len >= 15 ? 'bold' : 'normal';
      clearButton.style.display = (len > 0 && !nameInput.disabled) ? 'flex' : 'none';
      progressBar.style.width = `${(len / 20) * 100}%`;
      progressBar.style.opacity = len > 0 ? '1' : '0';
      progressBar.setAttribute('aria-valuenow', len.toString());
      progressBar.style.backgroundColor = len >= 18 ? '#dc3545' : (len >= 15 ? '#fd7e14' : '#0056b3');

      if (len === 15 && lastAlert !== 15) {
        copyAnnouncer.textContent = '15 characters. Approaching limit.';
        lastAlert = 15;
      } else if (len === 18 && lastAlert !== 18) {
        copyAnnouncer.textContent = '18 characters. Limit almost reached.';
        lastAlert = 18;
      } else if (len === 20 && lastAlert !== 20) {
        copyAnnouncer.textContent = '20 characters. Maximum limit reached.';
        lastAlert = 20;
      } else if (len < 15) {
        lastAlert = 0;
      }
    };

    nameInput.addEventListener('input', updateCounter);

    const clearInput = () => {
      nameInput.value = '';
      updateCounter();
      nameInput.focus();
      copyAnnouncer.textContent = '';
      setTimeout(() => {
        copyAnnouncer.textContent = 'Name input cleared.';
      }, 50);
    };

    clearButton.addEventListener('click', clearInput);

    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && nameInput.value) {
        e.preventDefault();
        clearInput();
      }
    });

    greetingForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      submitButton.disabled = true;
      nameInput.disabled = true;
      submitButton.textContent = 'Generating...';
      statusDisplay.textContent = 'Generating greeting...';
      statusDisplay.classList.remove('fade-in');
      copyButton.style.display = 'none';
      updateCounter();

      setTimeout(() => {
        greeting = `Hello, ${name}! 🎨`;
        statusDisplay.textContent = greeting;
        statusDisplay.classList.add('fade-in');
        submitButton.disabled = false;
        nameInput.disabled = false;
        submitButton.textContent = 'Generate Greeting';
        greetingForm.reset();
        updateCounter();
        copyButton.style.display = 'inline-block';
        submitButton.focus();
      }, 800);
    });

    const copyToClipboard = (text) => {
      const fallback = () => {
        const t = document.body.appendChild(document.createElement('textarea'));
        t.value = text;
        t.select();
        try { document.execCommand('copy'); } catch (err) {}
        t.remove();
      };
      return navigator.clipboard && navigator.clipboard.writeText
        ? navigator.clipboard.writeText(text).catch(fallback)
        : Promise.resolve(fallback());
    };

    copyButton.addEventListener('click', () => {
      if (copyTimeout) return;
      copyToClipboard(greeting).then(() => {
        copyButton.textContent = 'Copied! ✅';
        copyButton.setAttribute('aria-label', 'Greeting copied');
        copyAnnouncer.textContent = '';
        setTimeout(() => {
          copyAnnouncer.textContent = 'Greeting copied to clipboard';
        }, 50);
        copyTimeout = setTimeout(() => {
          copyButton.textContent = 'Copy';
          copyButton.setAttribute('aria-label', 'Copy greeting');
          copyTimeout = null;
        }, 2000);
      });
    });
  </script>
</body>
</html>
