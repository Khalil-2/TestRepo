<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TestRepo</title><style>
:root{font-family:system-ui;line-height:1.5}.skip-link{position:fixed;top:-100%;left:0;z-index:100}.skip-link:focus{top:0;background:#0056b3;color:#fff;padding:.5rem}#live{margin-top:1rem;font-weight:700;color:#155724}button:disabled{opacity:.7;cursor:not-allowed}.counter{font-size:.875rem;color:#666;margin-left:.5rem}#x:hover{color:#333 !important}
</style></head>
<body style="max-width:800px;margin:2rem auto;padding:0 1rem">
<a href="#main" class="skip-link">Skip to main content</a>
<header><h1>Welcome to TestRepo</h1></header>
<main id="main" tabindex="-1">
<p>Accessible landing page with interactive delight.</p>
<form id="f"><div style="display:flex;justify-content:space-between;align-items:baseline"><label for="i">Enter name:</label><span id="c" class="counter" aria-live="polite">0/20</span></div>
<div style="position:relative;margin:.5rem 0"><input id="i" maxlength="20" aria-describedby="c" required style="width:100%;box-sizing:border-box;padding-right:2rem"><button type="button" id="x" aria-label="Clear name input" style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;font-size:1.2rem;color:#666;padding:0">×</button></div>
<div style="margin-top:1rem"><button type="submit" id="b">Get Greeting</button></div></form>
<div id="live" aria-live="polite"></div>
</main>
<script>
const f=document.getElementById('f'),i=document.getElementById('i'),c=document.getElementById('c'),b=document.getElementById('b'),l=document.getElementById('live'),x=document.getElementById('x');
const u=()=>{const len=i.value.length;c.textContent=`${len}/20`;x.style.display=(len>0&&!i.disabled)?'block':'none';};
i.addEventListener('input',u);
x.addEventListener('click',()=>{i.value='';u();i.focus();});
i.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&i.value){e.preventDefault();i.value='';u();}});
f.onsubmit=(e)=>{e.preventDefault();const n=i.value.trim();b.disabled=true;const t=b.textContent;b.textContent='Loading...';l.textContent='';x.style.display='none';setTimeout(()=>{l.textContent=`Hello, ${n}! 🎨`;b.disabled=false;b.textContent=t;f.reset();u();b.focus();},800);};
</script>
</body></html>
