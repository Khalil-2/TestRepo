<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TestRepo</title>
  <style>
    :root { font-family: system-ui; line-height: 1.5; color-scheme: light dark; }
    body { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .skip-link { position: absolute; top: -100px; left: 0; background: #0056b3; color: #fff; padding: 1rem; z-index: 100; }
    .skip-link:focus { top: 0; }
    #status { margin-top: 1rem; font-weight: bold; color: #155724; }
    button:disabled { cursor: not-allowed; opacity: 0.7; }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>
  <header><h1>TestRepo</h1></header>
  <main id="main" tabindex="-1">
    <button id="greet-btn" type="button">Get Greeting</button>
    <div id="status" aria-live="polite"></div>
  </main>
  <script>
    const btn = document.getElementById('greet-btn');
    const status = document.getElementById('status');
    btn.addEventListener('click', () => {
      btn.disabled = true;
      btn.textContent = 'Loading...';
      status.textContent = '';
      setTimeout(() => {
        status.textContent = 'Hello! Hope you have a wonderful day! 🎨';
        btn.textContent = 'Get Greeting';
        btn.disabled = false;
      }, 800);
    });
  </script>
</body>
</html>
