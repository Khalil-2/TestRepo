<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestRepo - Home</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #374151; }
        header { border-bottom: 1px solid #e5e7eb; padding-bottom: 1rem; margin-bottom: 2rem; }
        h1 { color: #111827; }
        button { background-color: #2563eb; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; border: none; font-weight: 500; cursor: pointer; }
        button:hover { background-color: #1d4ed8; }
        button:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    </style>
</head>
<body>
    <header>
        <h1>TestRepo</h1>
    </header>
    <main>
        <p>Welcome to TestRepo, a project dedicated to demonstrating clean, accessible web interfaces.</p>
        <button aria-label="Learn more about the TestRepo project" type="button">Learn More</button>
    </main>
    <footer>
        <p>&copy; 2025 TestRepo. Accessibility first.</p>
    </footer>
</body>
</html>
