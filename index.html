<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TestRepo</title><style>
  :root{font-family:system-ui;line-height:1.5}
  .skip-link{position:absolute;left:-9999px}.skip-link:focus{position:static;background:#0056b3;color:#fff;padding:.5rem}
  #live{margin-top:1rem;font-weight:700}
</style></head>
<body style="max-width:800px;margin:2rem auto;padding:0 1rem">
  <a href="#main" class="skip-link">Skip to main content</a>
  <header><h1>Welcome to TestRepo</h1></header>
  <main id="main" tabindex="-1">
    <form id="greet-form">
      <label for="name">Enter your name:</label>
      <input id="name" maxlength="20" aria-describedby="char-count" required>
      <span id="char-count">0/20</span>
      <button type="submit">Greet Me</button>
    </form>
    <div id="live" aria-live="polite"></div>
  </main>
  <script>
    const nameInput = document.getElementById('name');
    const charCount = document.getElementById('char-count');
    const live = document.getElementById('live');
    nameInput.addEventListener('input', () => charCount.textContent = `${nameInput.value.length}/20`);
    document.getElementById('greet-form').addEventListener('submit', (e) => {
      e.preventDefault();
      live.textContent = `Hello, ${nameInput.value}! 🎨`;
    });
  </script>
</body></html>
