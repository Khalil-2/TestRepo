<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Greeting Generator</title><style>:root{font-family:system-ui;line-height:1.5} body{max-width:400px;margin:2rem auto;padding:0 1rem} .skip{position:fixed;top:-100%} .skip:focus{top:0;background:#0056b3;color:#fff;padding:.5rem} button,input{padding:.5rem;border:1px solid #ccc;border-radius:4px;font:inherit;transition:all .2s} button{background:#007bff;color:#fff;border:none;cursor:pointer} button:hover:not(:disabled){filter:brightness(90%)} button:disabled{opacity:.6} :focus-visible{outline:3px solid #0056b3;outline-offset:2px} #clearBtn{background:transparent;color:#666;border:none;padding:0;width:28px;height:28px;border-radius:50%;display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);cursor:pointer;align-items:center;justify-content:center} #clearBtn:hover{background:#eee;color:#333} @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}} .fade-in{animation:fadeIn .3s ease-out}</style></head>
<body><a href="#main" class="skip">Skip to main content</a><main id="main" tabindex="-1"><h1>Greeting Generator</h1>
<form id="greetingForm"><div style="display:flex;justify-content:space-between;align-items:center"><label for="nameInput">Your Name</label><span id="charCounter" style="font-size:.875rem;color:#666">0/20</span></div>
<div style="position:relative;margin:.5rem 0"><input id="nameInput" maxlength="20" aria-describedby="charCounter" aria-keyshortcuts="Escape" required style="width:100%;box-sizing:border-box;padding-right:2.2rem"><button type="button" id="clearBtn" aria-label="Clear name input" title="Clear name (Esc)">×</button></div>
<div id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" aria-label="Character limit" style="height:4px;width:0%;background:#007bff;border-radius:2px;margin-bottom:.5rem;opacity:0;transition:width .15s,background-color .15s,opacity .15s"></div>
<button type="submit" id="submitBtn">Generate Greeting</button></form>
<div style="margin-top:1.5rem;display:flex;align-items:center;gap:.5rem"><div id="status" aria-live="polite" style="font-weight:bold;color:#155724"></div><button id="copyBtn" aria-label="Copy greeting" style="display:none;padding:.25rem .5rem;font-size:.875rem">Copy</button></div>
<div id="copyAnnouncer" aria-live="polite" class="skip"></div></main>
<script>
const greetingForm = document.getElementById('greetingForm'), nameInput = document.getElementById('nameInput'), charCounter = document.getElementById('charCounter'), submitBtn = document.getElementById('submitBtn'), statusDisplay = document.getElementById('status'), copyBtn = document.getElementById('copyBtn'), copyAnnouncer = document.getElementById('copyAnnouncer'), clearBtn = document.getElementById('clearBtn'), progressBar = document.getElementById('progressBar');
let greetingText = '', copyTimeout, lastAlert = 0;
const updateCounter = () => {
  const len = nameInput.value.length; charCounter.textContent = `${len}/20`;
  const isRed = len >= 18, isOrange = len >= 15, color = isRed ? '#dc3545' : (isOrange ? '#fd7e14' : '#007bff');
  charCounter.style.color = color; charCounter.style.fontWeight = (isRed || isOrange) ? 'bold' : 'normal';
  progressBar.style.width = `${(len / 20) * 100}%`; progressBar.style.backgroundColor = color; progressBar.setAttribute('aria-valuenow', len); progressBar.style.opacity = len > 0 ? '1' : '0';
  clearBtn.style.display = (len > 0 && !nameInput.disabled) ? 'flex' : 'none';
  if (len === 15 && lastAlert !== 15) copyAnnouncer.textContent = '15 characters. Approaching limit.', lastAlert = 15;
  else if (len === 18 && lastAlert !== 18) copyAnnouncer.textContent = '18 characters. Limit almost reached.', lastAlert = 18;
  else if (len === 20 && lastAlert !== 20) copyAnnouncer.textContent = '20 characters. Maximum limit reached.', lastAlert = 20;
  else if (len < 15) lastAlert = 0;
};
nameInput.addEventListener('input', updateCounter);
clearBtn.addEventListener('click', () => { nameInput.value = ''; updateCounter(); nameInput.focus(); });
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Escape' && nameInput.value) { e.preventDefault(); nameInput.value = ''; updateCounter(); } });
greetingForm.addEventListener('submit', (e) => {
  e.preventDefault(); const name = nameInput.value.trim(); if (!name) return;
  submitBtn.disabled = nameInput.disabled = true; submitBtn.textContent = 'Generating...'; statusDisplay.textContent = 'Generating greeting...'; statusDisplay.classList.remove('fade-in'); copyBtn.style.display = 'none'; updateCounter();
  setTimeout(() => {
    greetingText = `Hello, ${name}! 🎨`; statusDisplay.textContent = greetingText; statusDisplay.classList.add('fade-in');
    submitBtn.disabled = nameInput.disabled = false; submitBtn.textContent = 'Generate Greeting'; greetingForm.reset(); updateCounter(); copyBtn.style.display = 'inline-block'; submitBtn.focus();
  }, 800);
});
copyBtn.addEventListener('click', () => {
  if (copyTimeout) return;
  navigator.clipboard.writeText(greetingText).then(() => {
    copyBtn.textContent = 'Copied! ✅'; copyBtn.setAttribute('aria-label', 'Greeting copied'); copyAnnouncer.textContent = '';
    setTimeout(() => { copyAnnouncer.textContent = 'Greeting copied to clipboard'; }, 50);
    copyTimeout = setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.setAttribute('aria-label', 'Copy greeting'); copyTimeout = null; }, 2000);
  });
});
</script></body></html>
