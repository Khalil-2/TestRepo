<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Greeting</title>
<style>:root{font-family:system-ui;line-height:1.5}body{max-width:500px;margin:2rem auto;padding:0 1rem}.skip-link{position:fixed;top:-100%}.skip-link:focus{top:0;background:#0056b3;color:#fff;padding:.5rem}#status{margin-top:1.5rem;font-weight:700;color:#155724}button,input{padding:.5rem;border:1px solid #ccc;border-radius:4px;font:inherit}button{background:#007bff;color:#fff;border:none;cursor:pointer;transition:filter .2s}button:hover:not(:disabled){filter:brightness(90%)}button:disabled{opacity:.6}:focus-visible{outline:3px solid #0056b3;outline-offset:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style></head>
<body><a href="#main" class="skip-link">Skip to main content</a><main id="main" tabindex="-1"><h1>Greeting Generator</h1>
<form id="greetingForm"><label for="nameInput">Your Name</label> <input id="nameInput" maxlength="20" autocomplete="name" aria-describedby="charCounter" required> <span id="charCounter" style="font-size:.875rem;color:#666">0/20</span><div style="margin-top:1rem"><button type="submit" id="submitBtn">Generate Greeting</button></div></form><div id="status" aria-live="polite"></div></main>
<script>
const greetingForm=document.getElementById('greetingForm'),nameInput=document.getElementById('nameInput'),charCounter=document.getElementById('charCounter'),submitBtn=document.getElementById('submitBtn'),statusArea=document.getElementById('status');
let copyTimeout;
nameInput.oninput=()=>charCounter.textContent=`${nameInput.value.length}/20`;
greetingForm.onsubmit=(e)=>{
  e.preventDefault();const name=nameInput.value.trim();if(!name)return;
  submitBtn.disabled=nameInput.disabled=true;const originalText=submitBtn.textContent;submitBtn.textContent='Generating...';statusArea.textContent='';
  setTimeout(()=>{
    statusArea.innerHTML='';const span=document.createElement('span');span.textContent=`Hello, ${name}! 🎨`;
    const copyBtn=document.createElement('button');copyBtn.id='copyBtn';copyBtn.style.marginLeft='.5rem';copyBtn.style.fontSize='.8rem';copyBtn.style.padding='.2rem .4rem';
    copyBtn.ariaLabel='Copy greeting';copyBtn.textContent='Copy';
    statusArea.append(span,copyBtn);submitBtn.disabled=nameInput.disabled=false;submitBtn.textContent=originalText;greetingForm.reset();charCounter.textContent='0/20';submitBtn.focus();
    copyBtn.onclick=()=>{
      navigator.clipboard.writeText(span.textContent).then(()=>{
        if(copyTimeout)clearTimeout(copyTimeout);
        const originalBtnText=copyBtn.textContent;copyBtn.textContent='Copied! ✅';
        const announcement=document.createElement('span');announcement.setAttribute('aria-live','assertive');announcement.className='sr-only';announcement.textContent='Greeting copied to clipboard';
        document.body.appendChild(announcement);copyTimeout=setTimeout(()=>{copyBtn.textContent=originalBtnText;announcement.remove();},2000);
      });
    };
  },800);
};
</script></body></html>
