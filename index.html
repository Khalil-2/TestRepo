<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TestRepo</title><style>
:root{font-family:system-ui;line-height:1.5;color-scheme:light dark}
.skip-link{position:fixed;top:-100%;left:0;z-index:100}.skip-link:focus{top:0;background:#0056b3;color:#fff;padding:.5rem}
#live{margin-top:1rem;font-weight:700;color:#155724}
.field{margin-bottom:1rem}
small{display:block;color:#666}
</style></head>
<body style="max-width:800px;margin:2rem auto;padding:0 1rem">
<a href="#main" class="skip-link">Skip to main content</a>
<header><h1>TestRepo</h1></header>
<main id="main" tabindex="-1">
<form id="greet-form">
<div class="field">
<label for="name">Your Name:</label>
<input id="name" type="text" maxlength="20" required aria-describedby="char-count">
<small id="char-count" aria-live="polite">20 characters remaining</small>
</div>
<button type="submit">Get Greeting</button>
</form>
<div id="live" aria-live="polite"></div>
</main>
<script>
const form=document.getElementById('greet-form'),input=document.getElementById('name'),count=document.getElementById('char-count'),live=document.getElementById('live');
input.oninput=()=>{const r=20-input.value.length;count.textContent=`${r} character${r!==1?'s':''} remaining`};
form.onsubmit=e=>{e.preventDefault();live.textContent=`Hello, ${input.value}! 🎨`;form.reset();input.oninput();};
</script>
</body></html>
