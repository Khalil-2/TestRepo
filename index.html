<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TestRepo</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
    }
    /* Non-negotiable skip link for accessibility */
    .skip-link {
      position: fixed;
      top: -100px;
      left: 0;
      background: #0056b3;
      color: #fff;
      padding: 0.5rem;
      z-index: 100;
      text-decoration: none;
    }
    .skip-link:focus {
      top: 0;
    }
    #live {
      margin-top: 1rem;
      font-weight: 700;
    }
  </style>
</head>
<body style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
  <a href="#main" class="skip-link">Skip to main content</a>
  <header>
    <h1>Welcome to TestRepo</h1>
  </header>
  <main id="main" tabindex="-1">
    <p>Minimal accessible landing page with interactive delight.</p>
    <button id="msg-btn" type="button">Click for a message</button>
    <div id="live" aria-live="polite"></div>
  </main>
  <script>
    const btn = document.getElementById('msg-btn');
    const live = document.getElementById('live');

    btn.addEventListener('click', () => {
      if (btn.disabled) return;

      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = 'Loading...';

      // Simulate a brief async operation for UX feedback
      setTimeout(() => {
        live.textContent = 'Button clicked! 🎨';
        btn.textContent = originalText;
        btn.disabled = false;
        // Return focus for repetitive utility if needed, but here we just re-enable
      }, 800);
    });
  </script>
</body>
</html>
