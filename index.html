<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TestRepo</title><style>
  :root{font-family:system-ui;line-height:1.5}
  .skip-link{position:absolute;top:-100%;left:0}.skip-link:focus{top:0;background:#155724;color:#fff;padding:.5rem}
  #live{margin-top:1rem;font-weight:700;color:#155724}
  .counter{font-size:.875rem;color:#666}
</style></head>
<body style="max-width:800px;margin:2rem auto;padding:0 1rem">
  <a href="#main" class="skip-link">Skip to main content</a>
  <header><h1>Welcome to TestRepo</h1></header>
  <main id="main" tabindex="-1">
    <p>Get a personalized greeting with accessibility at its heart.</p>
    <div style="margin-bottom:1rem">
      <label for="name">Your Name:</label>
      <input id="name" maxlength="20" aria-describedby="count" placeholder="e.g. Jules">
      <div id="count" class="counter" aria-live="polite">0/20</div>
    </div>
    <button id="btn">Greet Me</button>
    <div id="live" aria-live="polite"></div>
  </main>
  <script>
    const b=document.getElementById('btn'),n=document.getElementById('name'),
    c=document.getElementById('count'),l=document.getElementById('live');
    n.oninput=()=>c.innerText=`${n.value.length}/20`;
    b.onclick=async()=>{
      const v=n.value.trim();if(!v)return;
      b.disabled=n.disabled=true;b.innerText='Loading...';l.innerText='';
      await new Promise(r=>setTimeout(r,800));
      l.innerText=`Hello, ${v}! 🎨`;b.disabled=n.disabled=false;
      b.innerText='Greet Me';b.focus();
    };
  </script>
</body></html>
