<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TestRepo</title><style>
:root{font-family:system-ui;line-height:1.5}
.skip-link{position:fixed;top:-100%}.skip-link:focus{top:0;background:#0056b3;color:#fff;padding:.5rem}
#live{margin-top:1rem;font-weight:700;color:#155724}
button:disabled{opacity:.7}
</style></head>
<body style="max-width:800px;margin:2rem auto;padding:0 1rem">
<a href="#main" class="skip-link">Skip to main content</a>
<header><h1>Welcome to TestRepo</h1></header>
<main id="main" tabindex="-1">
<form id="f"><label for="n">Name:</label>
<input id="n" maxlength="20" aria-describedby="c" required>
<div id="c" aria-live="polite">20 characters remaining</div>
<button id="b" style="margin-top:1rem">Greet me</button></form>
<div id="live" aria-live="polite"></div>
</main>
<script>
const f=document.getElementById('f'),i=document.getElementById('n'),c=document.getElementById('c'),b=document.getElementById('b'),l=document.getElementById('live');
i.oninput=()=>c.textContent=`${20-i.value.length} characters remaining`;
f.onsubmit=(e)=>{e.preventDefault();b.disabled=true;b.textContent='Loading...';l.textContent='';
setTimeout(()=>{l.textContent=`Hello, ${i.value}! 🎨`;b.disabled=false;b.textContent='Greet me';b.focus();},800);};
</script>
</body></html>
