<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Greeting Generator</title><style>
button,input{transition:all .2s} button:hover:not(:disabled){filter:brightness(90%);cursor:pointer} button:disabled{background:#ccc;color:#666;cursor:not-allowed} :focus-visible{outline:3px solid #0056b3;outline-offset:2px}
#clearBtn{background:transparent;color:#666;border:none;padding:0;width:32px;height:32px;border-radius:50%;display:none;position:absolute;right:4px;top:50%;transform:translateY(-50%);align-items:center;justify-content:center;line-height:1;cursor:pointer} #clearBtn:hover{background:#eee;color:#333} @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}} .fade-in{animation:fadeIn .3s ease-out}
</style></head><body style="font-family:system-ui;max-width:400px;margin:2rem auto;padding:0 1rem"><h1>Greeting Generator</h1>
<form id="greetingForm"><div style="display:flex;justify-content:space-between"><label for="nameInput">Your Name</label><span id="charCounter" style="font-size:.875rem;color:#666">0/20</span></div>
<div style="margin:.5rem 0;position:relative"><input id="nameInput" maxlength="20" aria-describedby="charCounter" aria-keyshortcuts="Escape" required style="width:100%;box-sizing:border-box;padding-right:2.5rem"><button type="button" id="clearBtn" aria-label="Clear name input">×</button></div>
<div id="progressBar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="20" aria-label="Character limit progress" style="height:4px;width:0%;background:#0056b3;border-radius:2px;margin-bottom:.5rem;opacity:0;transition:width .1s,background .1s,opacity .1s"></div>
<button type="submit" id="submitBtn">Generate Greeting</button></form>
<div style="margin-top:1.5rem;display:flex;align-items:center;gap:.5rem"><div id="status" aria-live="polite" style="font-weight:bold"></div><button id="copyBtn" aria-label="Copy greeting" style="display:none">Copy</button></div>
<div id="copyAnnouncer" aria-live="polite" style="position:fixed;top:-100%"></div>
<script>
const greetingForm = document.getElementById('greetingForm'), nameInput = document.getElementById('nameInput'), charCounter = document.getElementById('charCounter'), submitBtn = document.getElementById('submitBtn'), statusDisplay = document.getElementById('status'), copyBtn = document.getElementById('copyBtn'), copyAnnouncer = document.getElementById('copyAnnouncer'), clearBtn = document.getElementById('clearBtn'), progressBar = document.getElementById('progressBar');
let greetingText = '', copyTimeout, lastAlert = 0;
const updateCounter = () => {
  const len = nameInput.value.length; charCounter.textContent = `${len}/20`; charCounter.style.color = len >= 18 ? '#dc3545' : (len >= 15 ? '#fd7e14' : '#666'); charCounter.style.fontWeight = len >= 15 ? 'bold' : 'normal'; clearBtn.style.display = (len > 0 && !nameInput.disabled) ? 'flex' : 'none';
  progressBar.style.width = `${(len / 20) * 100}%`; progressBar.style.opacity = len > 0 ? '1' : '0'; progressBar.setAttribute('aria-valuenow', len); progressBar.style.backgroundColor = len >= 18 ? '#dc3545' : (len >= 15 ? '#fd7e14' : '#0056b3');
  if (len === 15 && lastAlert !== 15) copyAnnouncer.textContent = '15 characters. Approaching limit.', lastAlert = 15;
  else if (len === 18 && lastAlert !== 18) copyAnnouncer.textContent = '18 characters. Limit almost reached.', lastAlert = 18;
  else if (len === 20 && lastAlert !== 20) copyAnnouncer.textContent = '20 characters. Maximum limit reached.', lastAlert = 20;
  else if (len < 15) lastAlert = 0;
};
nameInput.addEventListener('input', updateCounter);
clearBtn.addEventListener('click', () => { nameInput.value = ''; updateCounter(); nameInput.focus(); });
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Escape' && nameInput.value) { e.preventDefault(); nameInput.value = ''; updateCounter(); } });
greetingForm.addEventListener('submit', (e) => {
  e.preventDefault(); const name = nameInput.value.trim(); submitBtn.disabled = nameInput.disabled = true; submitBtn.textContent = 'Generating...';
  statusDisplay.textContent = 'Generating greeting...'; statusDisplay.classList.remove('fade-in'); copyBtn.style.display = 'none'; updateCounter();
  setTimeout(() => {
    greetingText = `Hello, ${name}! 🎨`; statusDisplay.textContent = greetingText; statusDisplay.classList.add('fade-in');
    submitBtn.disabled = nameInput.disabled = false; submitBtn.textContent = 'Generate Greeting'; greetingForm.reset(); updateCounter(); copyBtn.style.display = 'inline-block'; submitBtn.focus();
  }, 800);
});
copyBtn.addEventListener('click', () => {
  if (copyTimeout) return;
  navigator.clipboard.writeText(greetingText).then(() => {
    copyBtn.textContent = 'Copied! ✅'; copyBtn.setAttribute('aria-label', 'Greeting copied'); copyAnnouncer.textContent = ''; setTimeout(() => { copyAnnouncer.textContent = 'Greeting copied to clipboard'; }, 50);
    copyTimeout = setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.setAttribute('aria-label', 'Copy greeting'); copyTimeout = null; }, 2000);
  });
});
</script></body></html>
