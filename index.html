<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Greeting</title>
<style>:root{font-family:system-ui;line-height:1.5}body{max-width:500px;margin:2rem auto;padding:0 1rem}.skip{position:fixed;top:-100%}.skip:focus{top:0;background:#0056b3;color:#fff;padding:.5rem}#statusContainer{display:flex;align-items:center;margin-top:1.5rem;gap:.5rem}#status{font-weight:700;color:#155724}button,input{padding:.5rem;border:1px solid #ccc;border-radius:4px;font:inherit}button{background:#007bff;color:#fff;border:none;cursor:pointer;transition:filter .2s}button:hover:not(:disabled){filter:brightness(90%)}button:disabled{opacity:.6}:focus-visible{outline:3px solid #0056b3;outline-offset:2px}@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}.fade-in{animation:fadeIn .4s ease-out}#clearBtn{background:transparent;color:#666;border:none;padding:0;width:32px;height:32px;border-radius:50%;display:none;position:absolute;right:4px;top:50%;transform:translateY(-50%);align-items:center;justify-content:center;line-height:1}#clearBtn:hover{background:#eee;color:#333;filter:none}</style></head>
<body><a href="#main" class="skip">Skip to main content</a><main id="main" tabindex="-1"><h1>Greeting Generator</h1>
<form id="greetingForm"><div style="display:flex;justify-content:space-between;align-items:center"><label for="nameInput">Your Name</label> <span id="charCounter" style="font-size:.875rem;color:#666;transition:color .2s,font-weight .2s">0/20</span></div><div style="position:relative;margin-top:.25rem"><input id="nameInput" maxlength="20" autocomplete="name" aria-describedby="charCounter" required style="width:100%;box-sizing:border-box;padding-right:2.5rem"><button type="button" id="clearBtn" aria-label="Clear name input">×</button></div><div id="progressContainer" style="background:#eee;height:4px;border-radius:2px;margin:.5rem 0;overflow:hidden"><div id="progressBar" style="background:#007bff;width:0%;height:100%;transition:width .2s,background-color .2s" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0"></div></div><div style="margin-top:1rem"><button type="submit" id="submitBtn">Generate Greeting</button></div></form>
<div id="statusContainer"><div id="status" aria-live="polite"></div><button id="copyBtn" aria-label="Copy greeting" style="display:none;padding:.25rem .5rem;font-size:.875rem">Copy</button></div><div id="copyAnnouncer" aria-live="polite" class="skip"></div></main>
<script>
const greetingForm = document.getElementById('greetingForm'), nameInput = document.getElementById('nameInput'), charCounter = document.getElementById('charCounter'), progressBar = document.getElementById('progressBar'), submitBtn = document.getElementById('submitBtn'), statusDisplay = document.getElementById('status'), copyBtn = document.getElementById('copyBtn'), copyAnnouncer = document.getElementById('copyAnnouncer'), clearBtn = document.getElementById('clearBtn');
let greetingText = '', copyTimeout;
const updateCounter = () => {
  const len = nameInput.value.length; charCounter.textContent = `${len}/20`;
  const percent = (len / 20) * 100; progressBar.style.width = `${percent}%`; progressBar.setAttribute('aria-valuenow', len);
  const isRed = len >= 18, isOrange = len >= 15;
  const color = isRed ? '#dc3545' : (isOrange ? '#fd7e14' : '#007bff');
  charCounter.style.color = color; progressBar.style.backgroundColor = color;
  charCounter.style.fontWeight = (isRed || isOrange) ? 'bold' : 'normal';
  clearBtn.style.display = (len > 0 && !nameInput.disabled) ? 'flex' : 'none';
};
nameInput.addEventListener('input', updateCounter);
clearBtn.addEventListener('click', () => { nameInput.value = ''; updateCounter(); nameInput.focus(); });
greetingForm.addEventListener('submit', (e) => {
  e.preventDefault(); const name = nameInput.value.trim(); if (!name) return;
  submitBtn.disabled = nameInput.disabled = true; updateCounter();
  const originalText = submitBtn.textContent; submitBtn.textContent = 'Generating...';
  statusDisplay.textContent = ''; statusDisplay.classList.remove('fade-in'); copyBtn.style.display = 'none';
  setTimeout(() => {
    greetingText = `Hello, ${name}! 🎨`; statusDisplay.textContent = greetingText;
    statusDisplay.classList.add('fade-in');
    submitBtn.disabled = nameInput.disabled = false; submitBtn.textContent = originalText;
    greetingForm.reset(); updateCounter(); copyBtn.style.display = 'inline-block'; submitBtn.focus();
  }, 800);
});
copyBtn.addEventListener('click', () => {
  if (copyTimeout) return;
  navigator.clipboard.writeText(greetingText).then(() => {
    copyBtn.textContent = 'Copied! ✅'; copyBtn.setAttribute('aria-label', 'Greeting copied'); copyAnnouncer.textContent = '';
    setTimeout(() => { copyAnnouncer.textContent = 'Greeting copied to clipboard'; }, 50);
    copyTimeout = setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.setAttribute('aria-label', 'Copy greeting'); copyTimeout = null; }, 2000);
  });
});
</script></body></html>
