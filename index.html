<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TestRepo - Accessible Landing Page</title>
</head>
<body>
  <a href="#main">Skip to content</a>
  <header><h1>TestRepo</h1></header>
  <main id="main" tabindex="-1">
    <h2>Accessible Baseline</h2>
    <p>This project uses semantic HTML and interactive feedback.</p>
    <button id="btn" aria-describedby="hint">Greet</button>
    <p id="hint">Announces a status update.</p>
    <div id="status" aria-live="polite"></div>
  </main>
  <footer><hr><p>&copy; 2025 TestRepo</p></footer>
  <script>
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('status').textContent = 'Welcome! Interactive feedback active.';
    });
  </script>
</body>
</html>
