<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TestRepo</title><style>
:root{font-family:system-ui;line-height:1.5}body{max-width:800px;margin:2rem auto;padding:0 1rem}
.skip-link{position:absolute;left:-9999px;top:0}.skip-link:focus{left:0;position:fixed;background:#0056b3;color:#fff;padding:.5rem}
#live{margin-top:1rem;font-weight:700}</style></head>
<body><a href="#main" class="skip-link">Skip to main content</a><header><h1>TestRepo</h1></header>
<main id="main" tabindex="-1"><p>Click the button below to receive a greeting.</p>
<button id="btn" type="button">Get Greeting</button><div id="live" aria-live="polite"></div></main>
<script>const b=document.getElementById('btn'),l=document.getElementById('live');
b.addEventListener('click',()=>{if(b.disabled)return;b.disabled=true;const t=b.textContent;b.textContent='Sending...';
setTimeout(()=>{b.textContent=t;b.disabled=false;l.textContent='Hello! Thanks for visiting. 🎨';},800);});
</script></body></html>
