<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TestRepo</title><style>
  :root{font-family:system-ui;line-height:1.5}
  .skip-link{position:absolute;top:-40px;left:0;background:#0056b3;color:#fff;padding:8px;z-index:100;transition:top .2s}.skip-link:focus{top:0}
  #live{margin-top:1rem;font-weight:700}
</style></head>
<body style="max-width:800px;margin:2rem auto;padding:0 1rem">
  <a href="#main" class="skip-link">Skip to main content</a>
  <header><h1>Welcome to TestRepo</h1></header>
  <main id="main" tabindex="-1">
    <p>Minimal accessible landing page with interactive delight.</p>
    <button id="msg-btn" type="button">Click for a message</button>
    <div id="live" aria-live="polite"></div>
  </main>
  <script>
    const btn = document.getElementById('msg-btn'), live = document.getElementById('live');
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      const originalText = btn.innerText;
      btn.disabled = true; btn.innerText = 'Loading...';
      setTimeout(() => {
        live.innerText = 'Button clicked! 🎨';
        btn.disabled = false; btn.innerText = originalText;
      }, 800);
    });
  </script>
</body></html>
