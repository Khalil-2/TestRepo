<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TestRepo</title><style>
:root{font-family:system-ui;line-height:1.5}body{max-width:800px;margin:2rem auto;padding:0 1rem}
.skip-link{position:absolute;left:-9999px;top:0}.skip-link:focus{left:0;position:fixed;background:#0056b3;color:#fff;padding:.5rem}
#msg{margin-top:1rem;font-weight:700;min-height:1.5rem}.counter{font-size:.8rem;color:#666;text-align:right;display:block}
form{display:grid;gap:0.5rem;max-width:300px}</style></head>
<body><a href="#main" class="skip-link">Skip to main content</a><header><h1>TestRepo</h1></header>
<main id="main" tabindex="-1"><form id="greet-form"><label for="name-input">Your Name</label>
<input type="text" id="name-input" maxlength="20" required aria-describedby="char-count">
<span id="char-count" class="counter">0/20</span><button type="submit" style="width:fit-content">Say Hello</button></form>
<div id="msg" aria-live="polite"></div></main><footer><hr><p>&copy; 2025 TestRepo</p></footer>
<script>const i=document.getElementById('name-input'),c=document.getElementById('char-count'),f=document.getElementById('greet-form'),m=document.getElementById('msg');
i.oninput=()=>c.textContent=`${i.value.length}/20`;
f.onsubmit=(e)=>{e.preventDefault();if(i.value.trim())m.textContent=`Hello, ${i.value.trim()}! 🎨`;};
</script></body></html>
