<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TestRepo</title><style>
:root{font-family:system-ui;line-height:1.5}.skip-link{position:fixed;top:-100%;left:0;z-index:100}.skip-link:focus{top:0;background:#0056b3;color:#fff;padding:.5rem}#live{margin-top:1rem;font-weight:700;color:#155724}button:disabled{opacity:.7;cursor:not-allowed}.counter{font-size:.875rem;color:#666;margin-left:.5rem}
</style></head>
<body style="max-width:800px;margin:2rem auto;padding:0 1rem">
<a href="#main" class="skip-link">Skip to main content</a>
<header><h1>Welcome to TestRepo</h1></header>
<main id="main" tabindex="-1">
<p>Accessible landing page with interactive delight.</p>
<form id="f"><label for="i">Enter name:</label>
<input id="i" maxlength="20" aria-describedby="c" required><span id="c" class="counter" aria-live="polite">0/20</span>
<div style="margin-top:1rem"><button type="submit" id="b">Get Greeting</button></div></form>
<div id="live" aria-live="polite"></div>
</main>
<script>
const f=document.getElementById('f'),i=document.getElementById('i'),c=document.getElementById('c'),b=document.getElementById('b'),l=document.getElementById('live');
i.oninput=()=>c.textContent=`${i.value.length}/20`;
f.onsubmit=(e)=>{e.preventDefault();const n=i.value.trim();b.disabled=true;const t=b.textContent;b.textContent='Loading...';l.textContent='';setTimeout(()=>{l.textContent=`Hello, ${n}! 🎨`;b.disabled=false;b.textContent=t;f.reset();c.textContent='0/20';b.focus();},800);};
</script>
</body></html>
