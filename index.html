<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Greeting</title>
<style>:root{font-family:system-ui;line-height:1.5}body{max-width:500px;margin:2rem auto;padding:0 1rem}.skip-link{position:fixed;top:-100%}.skip-link:focus{top:0;background:#0056b3;color:#fff;padding:.5rem}#status{margin-top:1.5rem;font-weight:700;color:#155724}button,input{padding:.5rem;border:1px solid #ccc;border-radius:4px;font:inherit}button{background:#007bff;color:#fff;border:none;cursor:pointer;transition:filter .2s}button:hover:not(:disabled){filter:brightness(90%)}button:disabled{opacity:.6}:focus-visible{outline:3px solid #0056b3;outline-offset:2px}#copyBtn{background:#28a745;margin-top:1rem;display:none}</style></head>
<body><a href="#main" class="skip-link">Skip to main content</a><main id="main" tabindex="-1"><h1>Greeting Generator</h1>
<form id="greetingForm"><label for="nameInput">Your Name</label> <input id="nameInput" maxlength="20" autocomplete="name" aria-describedby="charCounter" required> <span id="charCounter" style="font-size:.875rem;color:#666">0/20</span><div style="margin-top:1rem"><button type="submit" id="submitBtn">Generate Greeting</button></div></form><div id="status" aria-live="polite"></div><button id="copyBtn">Copy Greeting</button></main>
<script>const form=document.getElementById('greetingForm'),input=document.getElementById('nameInput'),counter=document.getElementById('charCounter'),btn=document.getElementById('submitBtn'),status=document.getElementById('status'),copy=document.getElementById('copyBtn');
let copyTimer;input.oninput=()=>counter.textContent=`${input.value.length}/20`;form.onsubmit=(e)=>{e.preventDefault();const n=input.value.trim();if(!n)return;btn.disabled=input.disabled=true;btn.textContent='Generating...';status.textContent='';copy.style.display='none';
setTimeout(()=>{status.textContent=`Hello, ${n}! 🎨`;btn.disabled=input.disabled=false;btn.textContent='Generate Greeting';form.reset();counter.textContent='0/20';copy.style.display='inline-block';btn.focus();},800)};
copy.onclick=()=>{navigator.clipboard.writeText(status.textContent).then(()=>{if(copyTimer)clearTimeout(copyTimer);copy.textContent='Copied! ✅';copyTimer=setTimeout(()=>{copy.textContent='Copy Greeting';copyTimer=null;},2000);});};</script></body></html>
